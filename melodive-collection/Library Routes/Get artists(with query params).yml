info:
  name: Get artists(with query params)
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/library/artists?page=1&limit=2"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "2"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
