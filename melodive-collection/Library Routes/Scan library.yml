info:
  name: Scan library
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/library/scan
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "path":"/path/to/music"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
