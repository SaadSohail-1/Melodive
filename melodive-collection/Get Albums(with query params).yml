info:
  name: Get Albums(with query params)
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}/api/library/albums?page=1&limit=1"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
