services:
  postgres:
    image: postgres:17
    container_name: melodive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: melodive
      POSTGRES_USER: melodive
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: